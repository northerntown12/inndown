<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ① 제목을 바꿔요 (탭에 보이는 제목) -->
    <title>여기에 글 제목 · 퇴근 후의 기록</title>
    <!-- ② 검색 결과에 보이는 한두 줄 소개 -->
    <meta name="description" content="이 글을 한두 문장으로 소개해 주세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../blog.css?v=1">
</head>
<!-- ③ data-post 는 파일 이름에서 .html 을 뺀 것 (posts.js 의 id 와 같게) -->
<body class="blog-page" data-base="../" data-post="2026-01-01-sample">
    <header class="bp-top">
        <div class="bp-top-in">
            <a class="bp-brand" href="../blog.html">퇴근 후의 기록<small>여행 · 음악 · 주식 · 일상</small></a>
            <a class="bp-home" href="../index.html">← 홈으로</a>
        </div>
    </header>

    <main class="bp-main">
        <nav class="post-crumb" id="post-crumb" aria-label="현재 위치"><a href="../blog.html">블로그</a></nav>

        <article class="post-article">
            <header class="post-head">
                <div class="post-meta"><span class="post-cat" id="post-cat"></span><time id="post-date"></time></div>
                <!-- ④ 본문 맨 위 큰 제목 -->
                <h1>여기에 글 제목</h1>
            </header>

            <!-- ⑤ 본문: 아래 모양들을 골라 쓰면 돼요 -->
            <div class="post-body">
                <p>첫 문단. 무엇에 대한 글인지 짧게 소개해요.</p>

                <h2>소제목</h2>
                <p>문단은 &lt;p&gt; … &lt;/p&gt; 로 감싸요.</p>

                <!-- 사진: posts/img 폴더에 넣고 경로를 적어요. alt 에는 사진 설명 -->
                <figure>
                    <img src="img/사진이름.webp" alt="사진 설명">
                    <figcaption>사진 아래 작은 설명</figcaption>
                </figure>

                <ul>
                    <li>목록 1</li>
                    <li>목록 2</li>
                </ul>

                <blockquote>인용하거나 강조하고 싶은 문장</blockquote>

                <table>
                    <tr><th>항목</th><th>내용</th></tr>
                    <tr><td>예</td><td>예</td></tr>
                </table>

                <p>마무리 문단.</p>
            </div>
        </article>

        <nav class="post-nav" id="post-nav" aria-label="다른 글"></nav>
    </main>

    <footer class="bp-foot">
        <a href="../index.html">홈</a><a href="../blog.html">블로그</a>
        <div>Copyright © 2026 WowEzBox. All rights reserved.</div>
    </footer>

    <script src="../posts.js?v=1"></script>
    <script src="../blog.js?v=1"></script>
</body>
</html>
