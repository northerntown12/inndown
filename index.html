<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-banner">
    <img class="banner-happy" src="happybanner.jpg" alt="">
    <span class="banner-title">A better world~~~</span>         
</div>
    <!-- 페이지 상단 제목: 양쪽 가로선 사이에 제목 공간 확보 -->
    <header class="site-header">
        <span class="header-line" aria-hidden="true"></span>
        <h1 class="page-header">Testing...</h1>
    </header>

    <div class="page-layout">
        <!-- 왼쪽: 기존 강아지 대신 나무 이미지 -->
        <aside class="tree-panel" aria-label="나무 이미지">
           <img src="pic1.jpg" alt="도시 이미지">
        </aside>

        <!-- 가운데: 기존 홈페이지 기능 -->
        <main class="center-panel">
            <div class="container">
                <div class="windows-logo-layout">
                    <div class="square top-left">
                        <div class="calculator">
                            <div class="display">
                                <div class="previous-operand"></div>
                                <div class="current-operand">0</div>
                            </div>
                            <button class="span-two">AC</button>
                            <button>DEL</button>
                            <button class="operator">÷</button>
                            <button>7</button>
                            <button>8</button>
                            <button>9</button>
                            <button class="operator">×</button>
                            <button>4</button>
                            <button>5</button>
                            <button>6</button>
                            <button class="operator">-</button>
                            <button>1</button>
                            <button>2</button>
                            <button>3</button>
                            <button class="operator">+</button>
                            <button>0</button>
                            <button>.</button>
                            <button class="span-two">=</button>
                        </div>
                    </div>

                    <div class="square top-right">
                        <div class="temp-converter">
                            <h2>온도 변환기</h2>
                            <div class="converter-input">
                                <input type="number" id="celsius" placeholder="섭씨 (°C)" class="temp-input">
                                <span class="equals">=</span>
                                <input type="number" id="fahrenheit" placeholder="화씨 (°F)" class="temp-input">
                            </div>
                            <div class="converter-buttons">
                                <button id="convert-c-to-f"> °C → °F </button>
                                <button id="convert-f-to-c"> °F → °C </button>
                            </div>
                        </div>
                    </div>

                    <div class="square bottom-left">
                        <div class="lotto-container">
                            <h2>로또 추첨기</h2>
                            <div class="lotto-balls" id="lotto-balls">
                                <div class="ball">?</div>
                                <div class="ball">?</div>
                                <div class="ball">?</div>
                                <div class="ball">?</div>
                                <div class="ball">?</div>
                                <div class="ball">?</div>
                                <span class="plus-sign">+</span>
                                <div class="ball bonus">?</div>
                            </div>
                            <button id="lotto-btn" class="slot-btn">SPIN!</button>
                        </div>
                    </div>

                    <div class="square bottom-right">
                        <div class="weather-widget" id="weather-widget" data-cond="clear" data-night="0">
                            <div class="weather-fx" id="weather-fx" aria-hidden="true"></div>
                            <div class="weather-dropdown" id="weather-dropdown" hidden></div>
                            <div class="weather-tip" id="weather-tip" role="status" hidden></div>
                            <div class="weather-content">
                                <h2>날씨 정보</h2>
                                <div class="weather-search" id="weather-searchrow">
                                    <div class="weather-combo">
                                        <input type="text" id="weather-input" placeholder="도시 입력"
                                               autocomplete="off" autocapitalize="off" spellcheck="false"
                                               enterkeyhint="search" aria-label="도시 입력">
                                        <button type="button" id="weather-toggle" class="weather-arrow"
                                                aria-label="도시 목록 열기" aria-expanded="false">▾</button>
                                    </div>
                                    <button type="button" id="weather-search" class="weather-go">검색</button>
                                </div>
                                <div class="weather-mid">
                                    <div class="weather-now">
                                        <div class="weather-place" id="weather-place">-</div>
                                        <div class="weather-main">
                                            <span class="weather-icon" id="weather-icon">⏳</span>
                                            <span class="weather-temp" id="weather-temp">--°</span>
                                        </div>
                                        <div class="weather-desc" id="weather-desc">불러오는 중...</div>
                                    </div>
                                    <div class="weather-forecast" aria-label="아침 6시 예보">
                                        <div class="weather-forecast-cap">오전 6시</div>
                                        <div class="weather-forecast-list" id="weather-forecast-list"></div>
                                    </div>
                                </div>
                                <div class="weather-details">
                                    <div><span>체감</span><b id="weather-feel">--</b></div>
                                    <div><span>습도</span><b id="weather-hum">--</b></div>
                                    <div><span>바람</span><b id="weather-wind">--</b></div>
                                </div>
                                <div class="weather-msg" id="weather-msg" role="status">업데이트 주기: 10분</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- 오른쪽: PC에서만 보이는 광고 배너 6개 -->
       <aside class="ad-sidebar" aria-label="광고 배너">
    <div class="ad-grid">
        <!-- 첫 번째 칸: 네이버로 이동하는 링크 + 슬레이트 그레이 파비콘 스타일 -->
        <a class="ad-banner favicon-banner naver-ad" 
           href="https://www.naver.com/" 
           target="_blank" 
           rel="noopener noreferrer" 
           aria-label="네이버">
        </a>
                <a class="ad-banner google-favicon-banner" 
           href="https://www.google.com/" 
           target="_blank" 
           rel="noopener noreferrer" 
           aria-label="구글">
        </a>
                <div class="ad-banner" aria-label="배너 공간"></div>
                <div class="ad-banner" aria-label="배너 공간"></div>
                <div class="ad-banner" aria-label="배너 공간"></div>
                <div class="ad-banner" aria-label="배너 공간"></div>
            </div>
        </aside>
    </div>

    <!-- 페이지 하단: 구분선, 저작권 문구, 방문자 카운터 -->
    <footer class="site-footer">
        <div class="footer-main-line" aria-hidden="true"></div>
        <div class="copyright-row">
            <span class="copyright-side-line" aria-hidden="true"></span>
            <p class="copyright">Copyright © 2026 Summerman All rights reserved.</p>
            <span class="copyright-side-line" aria-hidden="true"></span>
        </div>
        <div class="visitor-counter" aria-label="방문자 통계">
            <script src="https://www.stats4u.net/s4u.js" data-id="2739492242" data-style="3304" async></script>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="weather.js"></script>
    <script src="temp-converter.js"></script>
</body>
</html>
